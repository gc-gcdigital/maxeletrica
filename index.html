<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max Elétrica – Soluções em elétrica</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#001042;--accent:#c9cfdb;--icon:#001042;--silver:linear-gradient(180deg,#f7f8fb,#b7bfce);--bg:#fff;--ink:#1b1b1b;--muted:#5b5b5b;--line:#e6e3df;--dark:#000a2e;--darkink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--ink:#f2f2f2;--muted:#a9a9a9;--line:#2c2c2c;--dark:#00051a;--icon:#c9cfdb}}
:root[data-theme="dark"]{--bg:#141414;--ink:#f2f2f2;--muted:#a9a9a9;--line:#2c2c2c;--dark:#00051a;--icon:#c9cfdb}
html{background:var(--brand);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
h1,h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;line-height:1.05}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hero{background:var(--brand);color:#fff;text-align:center;padding:28px 24px 72px;clip-path:polygon(0 0,100% 0,100% calc(100% - 40px),0 100%)}
.hero img{width:180px;height:180px;border-radius:28px;display:block;margin:0 auto 12px}
.hero h1{font-size:44px;font-weight:800;letter-spacing:.01em}
.hero p{margin:6px 0 22px;font-size:17px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:14px;font-weight:600;font-size:17px}
.btn svg{width:22px;height:22px;flex:none;fill:currentColor}
.btn-wa{background:var(--silver);color:#1b1b1b;box-shadow:0 4px 0 rgba(0,0,0,.22)}
section{padding:28px 22px}
h2{font-size:32px;font-weight:800;margin-bottom:16px}
.svc{list-style:none;margin:0;padding:0}
.svc li{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.svc li:last-child{border-bottom:1px solid var(--line)}
.svc svg{width:28px;height:28px;flex:none;fill:var(--icon);margin-top:2px}
.svc b{display:block;font-size:18px}
.svc span{color:var(--muted);font-size:15px}
.work{background:var(--dark);color:var(--darkink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid figure{margin:0;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:#333}
.grid figure.wide{grid-column:1/-1}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;font-size:14px;font-weight:600;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.about p{margin:0 0 12px;max-width:62ch}
.contact{background:var(--brand);color:#fff;padding-bottom:36px}
.contact .list{display:grid;gap:12px}
.contact .btn{background:#fff;color:#1b1b1b}
.contact .btn.wa{background:var(--silver)}
footer{background:var(--brand);color:#fff;text-align:center;font-size:13px;padding:0 22px 22px;opacity:.9}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
